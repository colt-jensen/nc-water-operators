project:
  type: website
  output-dir: _site

website:
  title: "NC Water Operator Recruitment Program"
  description: "A research study by researchers at the UNC School of Government, in partnership with the North Carolina Rural Water Association, on how to recruit and retain licensed water operators. Learn how your utility can take part."
  navbar:
    background: primary
    pinned: true
    # Section links are page-relative (#about, not index.html#about) so they work on
    # both the English and Spanish pages, which share the same section IDs.
    left:
      - text: "About"
        href: "#about"
      - text: "What your utility gets"
        href: "#benefits"
      - text: "What's involved"
        href: "#involved"
      - text: "Timeline"
        href: "#timeline"
      - text: "Opt in"
        href: "#opt-in"
    right:
      - text: "English"
        href: index.html
      - text: "Español"
        href: es.html
  page-footer:
    center: |
      An independent research study by researchers at the UNC School of Government, in partnership with the North Carolina Rural Water Association.
      It is not a program or service of the School of Government, and views expressed here are the investigators' own.
      Reviewed by the UNC-Chapel Hill Institutional Review Board (IRB #[PENDING]).

      Estudio de investigación independiente realizado por investigadores de la UNC School of Government, en colaboración con la North Carolina Rural Water Association.
      No es un programa ni un servicio de la School of Government.

format:
  html:
    theme: [cosmo, custom.scss]
    toc: false
    page-layout: article
    anchor-sections: false
    link-external-newwindow: true
    grid:
      body-width: 860px
    # Quarto rewrites a bare "#about" navbar href to "./#about". On es.html that
    # resolves to the site root (index.html), so section links would bounce Spanish
    # readers to the English page. Strip the "./" so they stay in-page on whichever
    # language the reader is on. Without JS the links behave as they did before, so
    # this only ever improves matters.
    include-after-body:
      text: |
        <script>
          document.querySelectorAll('.navbar a[href^="./#"]').forEach(function (a) {
            a.setAttribute('href', a.getAttribute('href').slice(2));
          });
        </script>
